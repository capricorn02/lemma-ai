<!DOCTYPE html>

<head>

</head>
<body>
<button onclick="start()">!!!</button>
<video id="aaa" autoplay width="640" height="480"></video>
</body>
		
<script>
async function start() {
	captureStream = await navigator.mediaDevices.getDisplayMedia();
	aaa.srcObject = captureStream

	
}
</script>
